[build]
  base = "v2"
  command = "npm run verify"
  publish = "dist"
[build.environment]
  NODE_VERSION = "24"
  ASTRO_TELEMETRY_DISABLED = "1"
[context.production.environment]
  BUNKMETER_PRODUCTION = "true"
  CONTACT_EMAIL = "hello@bunkmeter.online"
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'; upgrade-insecure-requests"
    Cache-Control = "public, max-age=0, must-revalidate"
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[redirects]]
